# Unset keys use Atuin's defaults: https://docs.atuin.sh/latest/configuration/config/

# Kept from the config Atuin generates on first run.
enter_accept = true

# Open the search UI in the shell's current keymap (emacs, vim insert or vim
# normal) instead of always in emacs.
keymap_mode = "auto"

[theme]
name = "catppuccin-frappe-mauve"

# Command output capture, so Atuin AI can read it (it asks before each read):
# https://docs.atuin.sh/latest/ai/command-output/
[daemon]
enabled = true
autostart = true

[pty_proxy]
enabled = true

[output]
enabled = true

# Capture Claude Code and other agent sessions so `atuin resume` and
# `atuin threads search` can find them. Secrets are masked; stays local while
# sync is off: https://docs.atuin.sh/latest/ai/threads/
[threads]
capture = true
